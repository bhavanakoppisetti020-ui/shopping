<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discounts</title>
    <style>
        .product {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px;
            width: 200px;
            display: inline-block;
        }
        .discount {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Discounts</h1>
    <div class="product">
        <h2>Product 1</h2>
        <p>Original Price: $100</p>
        <p>Discounted Price: $80</p>
        <p class="discount">Discount: 20%</p>
    </div>
    <div class="product">
        <h2>Product 2</h2>
        <p>Original Price: $200</p>
        <p>Discounted Price: $150</p>
        <p class="discount">Discount: 25%</p>
    </div>
    <div class="product">
        <h2>Product 3</h2>
        <p>Original Price: $300</p>
        <p>Discounted Price: $240</p>
        <p class="discount">Discount: 20%</p>
    </div>
</body>
</html>
